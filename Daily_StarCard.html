                    `✨ I scratched a VIP Luck Index: [${starsTxt}]\n${title}\n🎓 Matched Chai Wan IT Programme: ${courseName}\n\n"${quote}"\n\n🎵 Today's Theme Song: ${songTitle}\n👉 Listen now: ${url}`
            }
        };

        let currentLang = 'zh';
        let cardsPool = [...DEFAULT_CARDS];
        let currentCard = null;
        let isScratchedComplete = false;
        let soundEnabled = true;
        let audioCtx = null;

        let canvas, ctx;
        let isDrawing = false;
        let scratchedPixelsPercentage = 0;
        let lastScratchSoundTime = 0;

        window.addEventListener('DOMContentLoaded', () => {
            initWebAudio();
            initCanvasScratch();
            applyLanguageUI();
            pickNewRandomCard();
        });

        function toggleLanguage() {
            currentLang = currentLang === 'zh' ? 'en' : 'zh';
            document.documentElement.lang = currentLang === 'zh' ? 'zh-HK' : 'en';
            applyLanguageUI();
            renderCurrentCardText();

            if (!isScratchedComplete && scratchedPixelsPercentage === 0) {
                drawGoldFoilOverlay();
            }
        }

        function applyLanguageUI() {
            const t = I18N[currentLang];
            document.title = t.pageTitle;
            document.getElementById('langToggleBtn').textContent = t.langBtnLabel;
            document.getElementById('soundToggleBtn').title = t.soundBtnTitle;
            document.getElementById('mainHeadline').textContent = t.mainHeadline;
            document.getElementById('courseHeaderLabel').textContent = t.courseHeaderLabel;
            document.getElementById('luckIndexLabel').textContent = t.luckIndexLabel;
            document.getElementById('soulSongLabel').textContent = t.soulSongLabel;
            document.getElementById('youtubeBtnLabel').textContent = t.youtubeBtnLabel;
            document.getElementById('shareBtnLabel').textContent = t.shareBtnLabel;
            document.getElementById('newCardBtnLabel').textContent = t.newCardBtnLabel;

            const progressEl = document.getElementById('progressText');
            if (progressEl) {
                progressEl.textContent = scratchedPixelsPercentage === 0
                    ? t.promptStart
                    : t.promptProgress(Math.min(100, scratchedPixelsPercentage));
            }
        }

        function renderCurrentCardText() {
            if (!currentCard) return;
            const isEn = currentLang === 'en';

            const title = (isEn && currentCard.title_en) ? currentCard.title_en : currentCard.title;
            const quote = (isEn && currentCard.quote_en) ? currentCard.quote_en : currentCard.quote;
            const songTitle = (isEn && currentCard.songTitle_en) ? currentCard.songTitle_en : currentCard.songTitle;
            const songDesc = (isEn && currentCard.songDesc_en) ? currentCard.songDesc_en : currentCard.songDesc;

            const cardTitle = document.getElementById('cardTitle');
            if (cardTitle) cardTitle.textContent = title;

            const cardQuote = document.getElementById('cardQuote');
            if (cardQuote) cardQuote.textContent = isEn ? `"${quote}"` : `「${quote}」`;

            const cardSongTitle = document.getElementById('cardSongTitle');
            if (cardSongTitle) cardSongTitle.textContent = songTitle;

            const cardSongDesc = document.getElementById('cardSongDesc');
            if (cardSongDesc) cardSongDesc.textContent = songDesc;

            const cardYoutubeBtn = document.getElementById('cardYoutubeBtn');
            if (cardYoutubeBtn) cardYoutubeBtn.href = currentCard.youtubeUrl;

            const cardCourseName = document.getElementById('cardCourseName');
            if (cardCourseName) cardCourseName.textContent = currentCard.courseName;
        }

        function initWebAudio() {
            try {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                if (AudioContext) audioCtx = new AudioContext();
            } catch(e) {}
        }

        /* Authentic Paper Scratching Sound (刮紙聲) Generator */
        function playScratchSound(xPosRatio = 0.5) {
            if (!soundEnabled || !audioCtx) return;
            const now = Date.now();
            if (now - lastScratchSoundTime < 45) return;
            lastScratchSoundTime = now;

            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }

            try {
                const duration = 0.045; // seconds per scratch hit
                const bufferSize = Math.floor(audioCtx.sampleRate * duration);
                const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
                const data = buffer.getChannelData(0);

                // Synthesize paper scrape noise with subtle micro friction impulses
                for (let i = 0; i < bufferSize; i++) {
                    let white = Math.random() * 2 - 1;
                    if (Math.random() < 0.12) {
                        white *= 1.8; // Granular paper texture impulse
                    }
                    data[i] = white;
                }

                const noise = audioCtx.createBufferSource();
                noise.buffer = buffer;

                // Bandpass filter centered around 3.8kHz - 5.0kHz for authentic paper scraping sound
                const filter = audioCtx.createBiquadFilter();
                filter.type = 'bandpass';
                filter.frequency.setValueAtTime(3800 + Math.random() * 1200, audioCtx.currentTime);
                filter.Q.setValueAtTime(1.8 + Math.random() * 0.8, audioCtx.currentTime);

                const gain = audioCtx.createGain();
                gain.gain.setValueAtTime(0.18, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.005, audioCtx.currentTime + duration);

                // Dynamic stereo panning mapped to touch X location
                let panner = null;
                if (typeof audioCtx.createStereoPanner === 'function') {
                    panner = audioCtx.createStereoPanner();
                    const panVal = Math.max(-1, Math.min(1, (xPosRatio * 2) - 1));
                    panner.pan.setValueAtTime(panVal, audioCtx.currentTime);
                }

                noise.connect(filter);
                if (panner) {
                    filter.connect(panner);
                    panner.connect(gain);
                } else {
                    filter.connect(gain);
                }
                gain.connect(audioCtx.destination);

                noise.start();
            } catch(e) {}
        }

        function playVictoryChime() {
            if (!soundEnabled || !audioCtx) return;
            if (audioCtx.state === 'suspended') audioCtx.resume();

            const notes = [523.25, 659.25, 783.99, 1046.50, 1318.51];
            notes.forEach((freq, idx) => {
                setTimeout(() => {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
                    gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.5);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start();
                    osc.stop(audioCtx.currentTime + 0.55);
                }, idx * 90);
            });
        }

        function toggleSound() {
            soundEnabled = !soundEnabled;
            const icon = document.getElementById('soundIcon');
            const t = I18N[currentLang];
            if (soundEnabled) {
                icon.className = "fa-solid fa-volume-high text-xs";
                showToast(t.soundOnToast);
            } else {
                icon.className = "fa-solid fa-volume-xmark text-xs text-slate-500";
                showToast(t.soundOffToast);
            }
        }

        function initCanvasScratch() {
            canvas = document.getElementById('scratchCanvas');
            ctx = canvas.getContext('2d', { willReadFrequently: true });

            resizeCanvas();
            window.addEventListener('resize', resizeCanvas);

            canvas.addEventListener('mousedown', startScratching);
            canvas.addEventListener('touchstart', startScratching, { passive: false });

            window.addEventListener('mousemove', scratchMove);
            window.addEventListener('touchmove', scratchMove, { passive: false });

            window.addEventListener('mouseup', stopScratching);
            window.addEventListener('touchend', stopScratching);
        }

        /* Mobile address bar scroll fix logic */
        function resizeCanvas() {
            if (!canvas) return;
            const rect = canvas.getBoundingClientRect();
            const newWidth = Math.round(rect.width);
            const newHeight = Math.round(rect.height);

            if (canvas.width !== newWidth || canvas.height !== newHeight) {
                canvas.width = newWidth;
                canvas.height = newHeight;
            }

            // CRITICAL FIX: If already revealed, NEVER redraw gold foil overlay!
            if (isScratchedComplete) {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
            } else {
                drawGoldFoilOverlay();
            }
        }

        function drawGoldFoilOverlay() {
            if (!canvas || isScratchedComplete) return;
            ctx.globalCompositeOperation = 'source-over';

            const grad = ctx.createLinearGradient(0, 0, canvas.width, canvas.height);
            grad.addColorStop(0, '#ca8a04');
            grad.addColorStop(0.3, '#fde047');
            grad.addColorStop(0.5, '#a16207');
            grad.addColorStop(0.7, '#fef9c3');
            grad.addColorStop(1, '#854d0e');

            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = 'rgba(255, 255, 255, 0.08)';
            for (let i = 0; i < canvas.height; i += 4) {
                ctx.fillRect(0, i, canvas.width, 1.5);
            }

            // Scratch overlay surface text
            ctx.fillStyle = '#451a03';
            ctx.font = currentLang === 'en' ? '900 15px "Outfit", sans-serif' : '900 16px "Noto Sans TC", sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(I18N[currentLang].canvasHeadline, canvas.width / 2, canvas.height / 2 - 12);

            ctx.fillStyle = '#78350f';
            ctx.font = '600 11px sans-serif';
            ctx.fillText('HKIIT CHAI WAN SOUVENIR', canvas.width / 2, canvas.height / 2 + 16);
        }

        function startScratching(e) {
            if (isScratchedComplete) return;
            e.preventDefault();
            isDrawing = true;
            scratchAtPoint(e);
        }

        function scratchMove(e) {
            if (!isDrawing || isScratchedComplete) return;
            e.preventDefault();
            scratchAtPoint(e);
        }

        function stopScratching() {
            if (!isDrawing) return;
            isDrawing = false;
            checkScratchedPercentage();
        }

        function scratchAtPoint(e) {
            const rect = canvas.getBoundingClientRect();
            let clientX, clientY;

            if (e.touches && e.touches.length > 0) {
                clientX = e.touches[0].clientX;
                clientY = e.touches[0].clientY;
            } else {
                clientX = e.clientX;
                clientY = e.clientY;
            }

            const x = clientX - rect.left;
            const y = clientY - rect.top;

            ctx.globalCompositeOperation = 'destination-out';
            ctx.beginPath();
            ctx.arc(x, y, 22, 0, Math.PI * 2);
            ctx.fill();

            const xRatio = canvas.width > 0 ? x / canvas.width : 0.5;
            playScratchSound(xRatio);

            if ("vibrate" in navigator && Math.random() > 0.6) {
                navigator.vibrate(15);
            }

            if (Math.random() > 0.7) {
                checkScratchedPercentage();
            }
        }

        function checkScratchedPercentage() {
            if (isScratchedComplete) return;

            const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            const pixels = imageData.data;
            let transparentPixels = 0;

            for (let i = 3; i < pixels.length; i += 16) {
                if (pixels[i] === 0) {
                    transparentPixels++;
                }
            }

            const totalSampledPixels = pixels.length / 16;
            scratchedPixelsPercentage = Math.round((transparentPixels / totalSampledPixels) * 100);

            const progressEl = document.getElementById('progressText');
            if (progressEl) {
                progressEl.textContent = I18N[currentLang].promptProgress(Math.min(100, scratchedPixelsPercentage));
            }

            // AUTO REVEAL threshold set to 15%
            if (scratchedPixelsPercentage >= 15) {
                revealFullCard();
            }
        }

        function revealFullCard() {
            isScratchedComplete = true;

            ctx.clearRect(0, 0, canvas.width, canvas.height);
            canvas.classList.add('pointer-events-none');
            
            const promptEl = document.getElementById('scratchPrompt');
            if (promptEl) promptEl.classList.add('opacity-0', 'pointer-events-none');

            const cardContent = document.getElementById('cardRevealedContent');
            if (cardContent) cardContent.classList.remove('opacity-0');

            // Reveal Course Block
            const courseBlock = document.getElementById('courseBlock');
            if (courseBlock) {
                courseBlock.classList.remove('opacity-0', 'scale-95', 'pointer-events-none');
                courseBlock.classList.add('opacity-100', 'scale-100', 'pointer-events-auto');
            }

            // Reveal Youtube Block
            const youtubeBlock = document.getElementById('youtubeBlock');
            if (youtubeBlock) {
                youtubeBlock.classList.remove('opacity-0', 'scale-95', 'pointer-events-none');
                youtubeBlock.classList.add('opacity-100', 'scale-100', 'pointer-events-auto');
            }

            playVictoryChime();
            triggerConfetti();

            if ("vibrate" in navigator) {
                navigator.vibrate([100, 50, 150]);
            }
        }

        function pickNewRandomCard() {
            isScratchedComplete = false;
            scratchedPixelsPercentage = 0;
            
            if (canvas) {
                canvas.classList.remove('pointer-events-none');
            }

            const randomIndex = Math.floor(Math.random() * cardsPool.length);
            currentCard = cardsPool[randomIndex];

            const starsContainer = document.getElementById('starsContainer');
            if (starsContainer) {
                starsContainer.innerHTML = '';
                for (let i = 1; i <= 5; i++) {
                    if (i <= currentCard.stars) {
                        starsContainer.innerHTML += `<i class="fa-solid fa-star"></i>`;
                    } else {
                        starsContainer.innerHTML += `<i class="fa-regular fa-star text-slate-700"></i>`;
                    }
                }
            }

            renderCurrentCardText();

            // Reset Course Block to invisible state without layout shift
            const courseBlock = document.getElementById('courseBlock');
            if (courseBlock) {
                courseBlock.classList.add('opacity-0', 'scale-95', 'pointer-events-none');
                courseBlock.classList.remove('opacity-100', 'scale-100', 'pointer-events-auto');
            }

            // Reset Youtube Block to invisible state without layout shift
            const youtubeBlock = document.getElementById('youtubeBlock');
            if (youtubeBlock) {
                youtubeBlock.classList.add('opacity-0', 'scale-95', 'pointer-events-none');
                youtubeBlock.classList.remove('opacity-100', 'scale-100', 'pointer-events-auto');
            }

            const cardContent = document.getElementById('cardRevealedContent');
            if (cardContent) cardContent.classList.remove('opacity-0');

            const promptEl = document.getElementById('scratchPrompt');
            if (promptEl) promptEl.classList.remove('opacity-0', 'pointer-events-none');

            const progressEl = document.getElementById('progressText');
            if (progressEl) progressEl.textContent = I18N[currentLang].promptStart;

            drawGoldFoilOverlay();
        }

        function openYoutubeLink(e, url) {
            if (e) e.stopPropagation();
            if (url && url !== '#') {
                window.open(url, '_blank');
            }
        }

        function triggerConfetti() {
            const canvasC = document.getElementById('confettiCanvas');
            if (!canvasC) return;
            const ctxC = canvasC.getContext('2d');
            canvasC.width = window.innerWidth;
            canvasC.height = window.innerHeight;

            const particles = [];
            const colors = ['#fde047', '#eab308', '#ca8a04', '#ffffff', '#ef4444', '#a855f7'];

            for (let i = 0; i < 80; i++) {
                particles.push({
                    x: canvasC.width / 2,
                    y: canvasC.height / 2,
                    vx: (Math.random() - 0.5) * 14,
                    vy: (Math.random() - 0.8) * 16,
                    size: Math.random() * 7 + 4,
                    color: colors[Math.floor(Math.random() * colors.length)],
                    alpha: 1,
                    rotation: Math.random() * 360,
                    spin: (Math.random() - 0.5) * 12
                });
            }

            function render() {
                ctxC.clearRect(0, 0, canvasC.width, canvasC.height);
                let alive = false;

                particles.forEach(p => {
                    p.x += p.vx;
                    p.y += p.vy;
                    p.vy += 0.35;
                    p.alpha -= 0.015;
                    p.rotation += p.spin;

                    if (p.alpha > 0) {
                        alive = true;
                        ctxC.save();
                        ctxC.translate(p.x, p.y);
                        ctxC.rotate((p.rotation * Math.PI) / 180);
                        ctxC.globalAlpha = Math.max(0, p.alpha);
                        ctxC.fillStyle = p.color;
                        ctxC.fillRect(-p.size / 2, -p.size / 2, p.size, p.size);
                        ctxC.restore();
                    }
                });

                if (alive) {
                    requestAnimationFrame(render);
                } else {
                    ctxC.clearRect(0, 0, canvasC.width, canvasC.height);
                }
            }
            render();
        }

        function shareResult() {
            if (!currentCard) return;

            const isEn = currentLang === 'en';
            const t = I18N[currentLang];
            const title = (isEn && currentCard.title_en) ? currentCard.title_en : currentCard.title;
            const quote = (isEn && currentCard.quote_en) ? currentCard.quote_en : currentCard.quote;
            const songTitle = (isEn && currentCard.songTitle_en) ? currentCard.songTitle_en : currentCard.songTitle;

            const starsTxt = "★".repeat(currentCard.stars) + "☆".repeat(5 - currentCard.stars);
            const shareText = t.shareBody(starsTxt, title, currentCard.courseName, quote, songTitle, currentCard.youtubeUrl);

            if (navigator.share) {
                navigator.share({
                    title: t.shareTitle,
                    text: shareText,
                    url: window.location.href
                }).catch(() => copyToClipboard(shareText));
            } else {
                copyToClipboard(shareText);
            }
        }

        function copyToClipboard(text) {
            const t = I18N[currentLang];
            const textarea = document.createElement('textarea');
            textarea.value = text;
            textarea.style.position = 'fixed';
            textarea.style.opacity = '0';
            document.body.appendChild(textarea);
            textarea.select();
            try {
                document.execCommand('copy');
                showToast(t.copySuccessToast);
            } catch (err) {
                showToast(t.copyFailToast);
            }
            document.body.removeChild(textarea);
        }

        function showToast(msg) {
            const toast = document.getElementById('toast');
            const toastText = document.getElementById('toastText');
            if (toastText) toastText.textContent = msg;
            if (toast) {
                toast.classList.remove('opacity-0', 'pointer-events-none');
                setTimeout(() => {
                    toast.classList.add('opacity-0', 'pointer-events-none');
                }, 2500);
            }
        }
    </script>
</body>
</html>
